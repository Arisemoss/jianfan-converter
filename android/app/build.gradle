plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wenjian.shuzhai'
    compileSdk 35

    defaultConfig {
        applicationId "com.wenjian.shuzhai"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
